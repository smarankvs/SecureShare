name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Static Application Security Testing (SAST)
  # ============================================================================
  sast_security_scan:
    name: SAST (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] semgrep

      - name: Run Bandit AST Security Scan
        run: |
          bandit -c bandit.yaml -r app/ -ll -v

      - name: Run Semgrep Rules Scan
        run: |
          semgrep scan --config=.semgrep.yml --error app/

  # ============================================================================
  # 2. Software Composition Analysis (SCA) & Dependency Vulnerability Scanning
  # ============================================================================
  sca_dependency_scan:
    name: SCA (Safety & Pip-Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCA Scanners
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Scan Dependencies with Safety
        run: |
          safety check -r requirements.txt --full-report || true

      - name: Audit Packages with Pip-Audit
        run: |
          pip-audit -r requirements.txt || true

  # ============================================================================
  # 3. Automated Testing & Code Quality
  # ============================================================================
  test_and_lint:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_security_testing
          DATABASE_URL: sqlite:///./test_secureshare.db
          AZURE_KEYVAULT_ENABLED: "false"
          AZURE_STORAGE_USE_LOCAL_FALLBACK: "true"
        run: |
          pytest -v --tb=short tests/
