# Bandit Configuration for SecureShare
# Static Application Security Testing (SAST)

### Target and Exclusions
exclude_dirs:
  - tests
  - alembic
  - secure_storage_data
  - .git
  - __pycache__

### Confidence and Severity Thresholds
skips:
  - B101  # Allow assert in non-production test harnesses
  - B104  # Allow binding to 0.0.0.0 in Docker container configurations

### Specific Test Options
any_other_function_with_shell_equals_true:
  no_shell:
    - os.execl
    - os.execle
    - os.execlp
    - os.execlpe
    - os.execv
    - os.execve
    - os.execvp
    - os.execvpe
    - os.spawnl
    - os.spawnle
    - os.spawnlp
    - os.spawnlpe
    - os.spawnv
    - os.spawnve
    - os.spawnvp
    - os.spawnvpe
    - os.startfile
    - os.system

execute_used:
  subprocess:
    - subprocess.Popen
    - subprocess.call
    - subprocess.check_call
    - subprocess.check_output
